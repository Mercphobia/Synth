[project]
name = "synth"
version = "0.1.0"
description = "CLI AI agent framework — chat with an LLM and execute file/shell operations"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
synth = "synth.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/synth --cov-report=term-missing"
